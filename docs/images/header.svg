<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="'Microsoft YaHei','PingFang SC',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#0a1729"/><stop offset="0.55" stop-color="#070f1c"/><stop offset="1" stop-color="#04070d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.20"/><stop offset="0.55" stop-color="#2f7fe8" stop-opacity="0.07"/><stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#2f7fe8" stop-opacity="0.5"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rackTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a525c"/><stop offset="1" stop-color="#2c333c"/>
    </linearGradient>
    <linearGradient id="rackFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333a44"/><stop offset="1" stop-color="#1d232b"/>
    </linearGradient>
    <linearGradient id="alarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4d4f" stop-opacity="0.85"/><stop offset="1" stop-color="#ff4d4f" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#22d3ee" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="led" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- 左侧：项目标识 -->
  <g transform="translate(64,58)">
    <text x="0" y="0" fill="#5f7791" font-size="12" letter-spacing="6">IDC · DIGITAL TWIN · O&amp;M</text>
    <text x="0" y="62" fill="#eaf9ff" font-size="46" font-weight="700" letter-spacing="4" filter="url(#soft)">IDC 可视化运维项目</text>
    <text x="2" y="94" fill="#7fd8ff" font-size="19" letter-spacing="9">IDC VISUAL OPS</text>
    <rect x="0" y="116" width="620" height="1.6" fill="url(#rule)"/>
    <text x="0" y="148" fill="#b9cfe8" font-size="15.5">三维机房数字孪生 · 数据大屏 · 动力环境监控 · 二维图纸图元库</text>
    <text x="0" y="174" fill="#8aa0bd" font-size="14">纯前端离线可跑 ｜ 运行时零第三方依赖 ｜ Modbus / SNMP / MQTT 动环网关</text>
  </g>

  <!-- 数据条：本项目专属「机房数据条」 -->
  <g transform="translate(64,236)">
    <rect x="0" y="0" width="700" height="42" rx="6" fill="#0b1725" stroke="#22d3ee" stroke-opacity="0.28"/>
    <g fill="#7fd8ff" font-size="13">
      <text x="20" y="27">机柜 <tspan fill="#eaf9ff" font-weight="700">42</tspan></text>
      <text x="118" y="27">设备 <tspan fill="#eaf9ff" font-weight="700">256</tspan></text>
      <text x="216" y="27">动环 <tspan fill="#eaf9ff" font-weight="700">39</tspan> 台 / <tspan fill="#eaf9ff" font-weight="700">260</tspan> 测点</text>
      <text x="416" y="27">图元 <tspan fill="#eaf9ff" font-weight="700">58</tspan></text>
      <text x="500" y="27">页面 <tspan fill="#eaf9ff" font-weight="700">9</tspan></text>
      <text x="592" y="27">依赖 <tspan fill="#22c55e" font-weight="700">0</tspan></text>
    </g>
  
    <text x="4" y="66" fill="#5f7791" font-size="11.5">开源许可 AGPL-3.0-or-later · 闭源商业集成需商业授权 · 演示数据，非真实机房上线系统</text>
  </g>

  <!-- 右侧：等轴测机房阵列（本项目 3D 观感的抽象） -->
  <g transform="translate(782,34) scale(0.92)">
    <!-- 地板网格（等轴测平台） -->
    <g opacity="0.75">
      <path d="M60 250 L250 165 L430 250 L240 335 Z" fill="#0a1523" stroke="#2f7fe8" stroke-opacity="0.35"/>
      <g stroke="#22d3ee" stroke-opacity="0.18" fill="none">
        <path d="M84 244 L418 244 M108 232 L396 232 M132 220 L374 220 M156 208 L352 208"/>
        <path d="M120 262 L270 196 M180 292 L330 226 M240 322 L390 256"/>
      </g>
    </g>
    <!-- 三排机柜 -->
    <g>
      <!-- 后排 -->
      <g fill="url(#rackFront)" stroke="#7fd8ff" stroke-opacity="0.35">
        <rect x="150" y="150" width="46" height="58" rx="3"/><rect x="204" y="150" width="46" height="58" rx="3"/>
        <rect x="258" y="150" width="46" height="58" rx="3"/><rect x="312" y="150" width="46" height="58" rx="3"/>
      </g>
      <g fill="url(#rackTop)" opacity="0.95">
        <path d="M150 150 L168 134 L214 134 L196 150 Z"/><path d="M204 150 L222 134 L268 134 L250 150 Z"/>
        <path d="M258 150 L276 134 L322 134 L304 150 Z"/><path d="M312 150 L330 134 L376 134 L358 150 Z"/>
      </g>
      <g fill="#22d3ee" filter="url(#led)" opacity="0.9">
        <rect x="153" y="160" width="40" height="2.4"/><rect x="207" y="160" width="40" height="2.4"/>
        <rect x="261" y="160" width="40" height="2.4"/><rect x="315" y="160" width="40" height="2.4"/>
      </g>
      <!-- 中排（含一台告警柜） -->
      <g fill="url(#rackFront)" stroke="#7fd8ff" stroke-opacity="0.35">
        <rect x="120" y="205" width="46" height="58" rx="3"/>
        <rect x="174" y="205" width="46" height="58" rx="3" stroke="#ff4d4f" stroke-opacity="0.9"/>
        <rect x="228" y="205" width="46" height="58" rx="3"/><rect x="282" y="205" width="46" height="58" rx="3"/>
      </g>
      <g fill="url(#rackTop)" opacity="0.95">
        <path d="M120 205 L138 189 L184 189 L166 205 Z"/>
        <path d="M174 205 L192 189 L238 189 L220 205 Z"/>
        <path d="M228 205 L246 189 L292 189 L274 205 Z"/><path d="M282 205 L300 189 L346 189 L328 205 Z"/>
      </g>
      <g fill="#22d3ee" filter="url(#led)" opacity="0.9">
        <rect x="123" y="215" width="40" height="2.4"/><rect x="177" y="215" width="40" height="2.4"/>
        <rect x="231" y="215" width="40" height="2.4"/><rect x="285" y="215" width="40" height="2.4"/>
      </g>
      <!-- 告警光柱 + 地面光圈 -->
      <rect x="190" y="118" width="14" height="90" fill="url(#alarm)" opacity="0.9"/>
      <ellipse cx="197" cy="266" rx="30" ry="9" fill="none" stroke="#ff4d4f" stroke-opacity="0.75" stroke-width="1.6"/>
      <circle cx="197" cy="118" r="5" fill="#ff4d4f" filter="url(#led)"/>
      <!-- 前排 -->
      <g fill="url(#rackFront)" stroke="#7fd8ff" stroke-opacity="0.35">
        <rect x="196" y="262" width="46" height="58" rx="3"/><rect x="250" y="262" width="46" height="58" rx="3"/>
        <rect x="304" y="262" width="46" height="58" rx="3"/>
      </g>
      <g fill="url(#rackTop)" opacity="0.95">
        <path d="M196 262 L214 246 L260 246 L242 262 Z"/><path d="M250 262 L268 246 L314 246 L296 262 Z"/>
        <path d="M304 262 L322 246 L368 246 L350 262 Z"/>
      </g>
      <g fill="#22d3ee" filter="url(#led)" opacity="0.9">
        <rect x="199" y="272" width="40" height="2.4"/><rect x="253" y="272" width="40" height="2.4"/>
        <rect x="307" y="272" width="40" height="2.4"/>
      </g>
      <!-- 冷通道格栅 -->
      <path d="M150 268 L246 226 L300 250 L204 292 Z" fill="#22d3ee" fill-opacity="0.07"/>
      <!-- 吊顶灯盘 -->
      <g opacity="0.55">
        <ellipse cx="150" cy="120" rx="42" ry="12" fill="#cfe8ff" fill-opacity="0.12"/>
        <ellipse cx="330" cy="120" rx="42" ry="12" fill="#cfe8ff" fill-opacity="0.12"/>
      </g>
      <!-- 小维（数字人剪影）-->
      <g transform="translate(96,286)">
        <circle cx="0" cy="-14" r="6.5" fill="#dce9ff"/><circle cx="-2.4" cy="-15" r="1.2" fill="#0a1729"/><circle cx="2.4" cy="-15" r="1.2" fill="#0a1729"/>
        <rect x="-7" y="-7" width="14" height="18" rx="5" fill="#7fd8ff" fill-opacity="0.85"/>
        <rect x="-5" y="12" width="3.6" height="8" rx="1.8" fill="#7fd8ff" fill-opacity="0.7"/>
        <rect x="1.4" y="12" width="3.6" height="8" rx="1.8" fill="#7fd8ff" fill-opacity="0.7"/>
        <circle cx="0" cy="-30" r="3" fill="#22d3ee" fill-opacity="0.5" filter="url(#led)"/>
      </g>
      <!-- 名称牌 -->
      <g transform="translate(150,330)">
        <rect x="0" y="-16" width="200" height="22" rx="4" fill="#0b1725" stroke="#22d3ee" stroke-opacity="0.3"/>
        <text x="100" y="0" fill="#7fd8ff" font-size="11.5" text-anchor="middle">A 排 · 数字孪生视角</text>
      </g>
    </g>
  </g>
</svg>