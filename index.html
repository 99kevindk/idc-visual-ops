<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IDC 可视化运维项目 · 3D 机房可视化运维</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a1524'/%3E%3Crect x='7' y='10' width='18' height='14' rx='2' fill='none' stroke='%2322d3ee' stroke-width='2'/%3E%3Cpath d='M11 14h10M11 18h10' stroke='%2322d3ee' stroke-width='2'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="src/base.css" />
<link rel="stylesheet" href="src/styles.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="tb-left">
      <span class="clock" id="clock">2026-11-02 14:28:36</span>
      <button class="btn-ghost" id="btn-guide">查看引导</button>
      <button class="btn-ghost" id="btn-about">制作资料</button>
    </div>
    <div class="tb-center">
      <div class="brand-wrap">
        <span class="brand-line"></span>
        <div class="brand">IDC 智能运维管理平台</div>
        <span class="brand-line"></span>
      </div>
      <div class="brand-en">IDC INTELLIGENT OPERATION AND MAINTENANCE PLATFORM</div>
    </div>
    <div class="tb-right">
      <span class="weather" id="weather">上海 18℃</span>
      <button class="icon-btn" id="btn-bell" title="告警消息">🔔<i class="dot" id="bell-dot">4</i></button>
      <span class="user"><i class="avatar">管</i>管理员</span>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab" data-page="overview">总览</button>
    <button class="tab" data-page="monitor">机房监控</button>
    <button class="tab" data-page="assets">资产管理</button>
    <button class="tab" data-page="energy">能效管理</button>
    <button class="tab" data-page="alarms">告警中心</button>
    <button class="tab" data-page="workorder">运维工单</button>
    <button class="tab" data-page="donghuan">动环监控</button>
    <button class="tab" data-page="plan">机房图纸</button>
  </nav>

  <main id="stage" data-page="overview">
    <canvas id="gl"></canvas>
    <div id="hud-root"></div>
    <div id="plan-root" class="hidden"></div>
    <div id="ticker" class="ticker"></div>
    <div id="intro" class="intro hidden">
      <div class="intro-inner">
        <div class="intro-kicker">DIGITAL TWIN · IDC</div>
        <h1 class="intro-title">IDC 智能运维管理平台</h1>
        <p class="intro-sub">三维机房数字孪生 · 语音巡检助手「小维」</p>
        <div class="intro-bar"><i></i></div>
        <div class="intro-hint">点击任意位置跳过片头</div>
      </div>
    </div>
  </main>

  <footer class="statusbar">
    <div class="kpis" id="kpis">
      <div class="kpi"><b id="kpi-rack">42</b><span>机柜总数</span></div>
      <div class="kpi"><b id="kpi-power">32.6<span class="unit">kW</span></b><span>总功耗</span></div>
      <div class="kpi"><b id="kpi-pue">1.36</b><span>PUE</span></div>
      <div class="kpi"><b id="kpi-avail">99.99<span class="unit">%</span></b><span>可用率</span></div>
    </div>
    <div class="sb-tip" id="sb-tip">本地演示数据 · 示例数据 · 非真实机房上线系统</div>
    <button class="mic-btn" id="btn-mic"><i class="mic-ico"></i><span>进入三维巡检</span></button>
  </footer>

  <div id="toast-root"></div>
</div>
<!-- 启动器：
     · http/https（含 localhost，源码运行的标准方式）→ 直接以 ES 模块加载 src/app.js；
     · file:// 双击 index.html → ES 模块会被浏览器拦截，改为加载打包产物 dist/app.js（本仓库不含构建产物，
       若不存在会给出明确提示：请用任意静态服务器以 http://localhost 打开）。 -->
<script>
(function () {
  function loadModule() {
    var m = document.createElement("script");
    m.type = "module"; m.src = "src/app.js";
    document.body.appendChild(m);
  }
  function loadBundleOrHint() {
    var b = document.createElement("script");
    b.src = "dist/app.js";
    b.onerror = function () {
      console.warn("[IDC] file:// 场景未找到 dist/app.js：本仓库只包含项目源码（不含构建产物），请用任意静态服务器以 http://localhost 方式打开。");
      var tip = document.createElement("div");
      tip.style.cssText = "position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:99;padding:18px 24px;background:#0a1524;border:1px solid rgba(64,180,255,.3);border-radius:4px;color:#dce9ff;font:14px/1.8 'Microsoft YaHei',sans-serif;max-width:600px";
      tip.innerHTML = "<b>请用 http://localhost 方式打开</b><br>本仓库只包含项目源码（不含构建产物与启动脚本），ES 模块在 file:// 下会被浏览器拦截。<br>" +
        "用任意静态服务器即可：<b>python -m http.server 8123</b> 或 <b>npx serve -l 8123</b>（VS Code Live Server 亦可），然后访问 http://localhost:8123/";
      document.body.appendChild(tip);
    };
    document.body.appendChild(b);
  }
  if (location.protocol === "file:") loadBundleOrHint();
  else loadModule();
})();
</script>
</body>
</html>
